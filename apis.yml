aid: milo-credit
name: Milo Credit
description: 'Milo (formerly Milo Credit) is a Miami-based financial technology company and licensed
  mortgage lender that pioneered crypto-backed lending. Milo lets cryptocurrency holders access cash or
  finance U.S. real estate without selling their digital assets, offering crypto-backed mortgages with up
  to 100% financing, self-custody mortgages, and crypto-backed loans funded in as little as 24 hours, with
  rates starting around 7%. The company was an early portfolio investment of QED Investors and operates as
  a consumer-facing lending platform rather than a developer/API-first company. As of this enrichment pass
  Milo publishes no public API, developer portal, SDKs, or API documentation; its public surface is a
  consumer web application (app.milo.io), a marketing site, a blog, an FAQ, and a hosted trust/security
  center. This profile is maintained in the API Evangelist network as a company record.'
